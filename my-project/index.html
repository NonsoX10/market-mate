<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MarketMate - Unified Storefront & Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    @keyframes rainbowGlow {
      0% { box-shadow: 0 0 12px rgba(16, 185, 129, 0.6); border-color: rgba(16, 185, 129, 0.8); }
      33% { box-shadow: 0 0 12px rgba(59, 130, 246, 0.6); border-color: rgba(59, 130, 246, 0.8); }
      66% { box-shadow: 0 0 12px rgba(168, 85, 247, 0.6); border-color: rgba(168, 85, 247, 0.8); }
      100% { box-shadow: 0 0 12px rgba(16, 185, 129, 0.6); border-color: rgba(16, 185, 129, 0.8); }
    }
    .animated-pill-glow { animation: rainbowGlow 4s infinite linear; }
  </style>
</head>
<body class="bg-slate-50 font-sans antialiased text-slate-800">

  <!-- TOP NAVBAR -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-4 md:px-6 py-3 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3">
      <!-- Mobile Sidebar Toggle Button -->
      <button id="mobile-menu-btn" class="md:hidden text-slate-700 p-1.5 rounded-lg hover:bg-slate-100">
        <i class="fa-solid fa-bars text-lg"></i>
      </button>
      <div class="bg-emerald-600 text-white p-2 rounded-lg font-bold text-base md:text-xl">MM</div>
      <h1 class="text-lg md:text-xl font-bold text-slate-900 tracking-tight">MarketMate</h1>
    </div>

    <!-- ROLE TOGGLE SWITCH (Animated Glow) -->
    <div class="bg-slate-100 p-1 rounded-full border border-transparent flex items-center space-x-1 animated-pill-glow shadow-sm scale-90 md:scale-100">
      <button id="btn-storefront" class="px-3 md:px-5 py-1.5 md:py-2 rounded-full font-medium text-xs md:text-sm transition-all duration-200 bg-emerald-600 text-white shadow-sm flex items-center space-x-2">
        <i class="fa-solid fa-store"></i>
        <span class="hidden sm:inline">Storefront</span>
      </button>
      <button id="btn-vendor" class="px-3 md:px-5 py-1.5 md:py-2 rounded-full font-medium text-xs md:text-sm transition-all duration-200 text-slate-600 hover:text-slate-900 flex items-center space-x-2">
        <i class="fa-solid fa-boxes-stacked"></i>
        <span class="hidden sm:inline">Vendor</span>
      </button>
    </div>

    <!-- SEARCH & CART QUICK ACTIONS -->
    <div class="flex items-center space-x-2 md:space-x-4">
      <div class="relative hidden lg:block w-64 xl:w-80">
        <input type="text" id="global-search" placeholder="Search products..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm" />
        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
      </div>
      <button id="cart-btn" class="relative bg-emerald-50 text-emerald-700 p-2 md:p-2.5 rounded-lg hover:bg-emerald-100 transition">
        <i class="fa-solid fa-cart-shopping text-base md:text-lg"></i>
        <span id="cart-count" class="absolute -top-1.5 -right-1.5 bg-emerald-600 text-white text-xs font-bold px-1.5 py-0.5 rounded-full">0</span>
      </button>
    </div>
  </header>

  <!-- Mobile Search Bar Bar Below Navbar -->
  <div class="bg-white border-b border-slate-200 px-4 py-2.5 lg:hidden">
    <div class="relative w-full">
      <input type="text" id="global-search-mobile" placeholder="Search products..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 shadow-sm" />
      <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-sm"></i>
    </div>
  </div>

  <div class="flex min-h-[calc(100vh-65px)] relative">

    <!-- SIDEBAR BACKDROP FOR MOBILE -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-30 hidden md:hidden"></div>

    <!-- SIDEBAR (Responsive Slide-out on Mobile) -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-64 bg-white border-r border-slate-200 p-4 flex flex-col justify-between shrink-0 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
      <div class="space-y-6">
        <div class="flex items-center justify-between md:hidden pb-2 border-b border-slate-100">
          <span class="font-bold text-slate-800">Menu</span>
          <button id="close-sidebar-btn" class="text-slate-400 hover:text-slate-700 p-1">
            <i class="fa-solid fa-xmark text-lg"></i>
          </button>
        </div>

        <div>
          <p class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2 px-2">Navigation</p>
          <nav class="space-y-1">
            <button id="nav-home" class="w-full text-left px-3 py-2.5 rounded-lg font-medium text-slate-700 bg-emerald-50 text-emerald-700 flex items-center space-x-3 transition">
              <i class="fa-solid fa-house"></i>
              <span>Home (All Products)</span>
            </button>

            <!-- Category Accordion Dropdown -->
            <div class="pt-2">
              <button id="category-accordion-btn" class="w-full text-left px-3 py-2.5 rounded-lg font-medium text-slate-700 hover:bg-slate-100 flex items-center justify-between transition">
                <span class="flex items-center space-x-3">
                  <i class="fa-solid fa-layer-group"></i>
                  <span>Categories</span>
                </span>
                <i id="category-chevron" class="fa-solid fa-chevron-down text-xs transition-transform duration-200"></i>
              </button>
              <div id="category-dropdown-list" class="pl-8 pt-1 space-y-1 hidden">
                <!-- Dynamically Populated Categories -->
              </div>
            </div>
          </nav>
        </div>
      </div>

      <!-- Bottom User Profile Item -->
      <div class="border-t border-slate-200 pt-4">
        <button id="nav-profile" class="w-full text-left p-2.5 rounded-lg hover:bg-slate-100 flex items-center space-x-3 transition">
          <div class="w-9 h-9 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center text-sm shadow-sm shrink-0" id="user-avatar">
            UM
          </div>
          <div class="overflow-hidden">
            <p id="profile-name-display" class="font-semibold text-slate-800 text-sm truncate">Uzoechi Michael</p>
            <p id="profile-email-display" class="text-xs text-slate-500 truncate">michael@marketmate.com</p>
          </div>
        </button>
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 p-4 md:p-6 overflow-y-auto w-full">

      <!-- 1. CUSTOMER STOREFRONT VIEW -->
      <section id="view-storefront" class="space-y-6">
        <div class="flex items-center justify-between">
          <h2 id="storefront-heading" class="text-xl md:text-2xl font-bold text-slate-900">All Products</h2>
          <span id="product-count-badge" class="text-xs md:text-sm font-medium bg-slate-200 text-slate-700 px-3 py-1 rounded-full">0 Items</span>
        </div>

        <!-- Storefront Product Cards Grid -->
        <div id="storefront-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
          <!-- Cards injected dynamically -->
        </div>
      </section>

      <!-- 2. VENDOR STOCK MANAGER VIEW -->
      <section id="view-vendor" class="space-y-6 hidden">
        <div class="bg-white p-4 md:p-6 rounded-xl border border-slate-200 shadow-sm">
          <h2 id="form-title" class="text-base md:text-lg font-bold text-slate-900 mb-4">Add New Product</h2>
          <form id="product-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <input type="hidden" id="edit-id" />
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Product Title</label>
              <input type="text" id="item-name" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" required />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Category</label>
              <input type="text" id="item-category" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" required />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Price (₦)</label>
              <input type="number" id="item-price" min="0" step="0.01" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" required />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Stock Quantity</label>
              <input type="number" id="item-quantity" min="0" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" required />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Image URL (Optional)</label>
              <input type="text" id="item-image" placeholder="https://..." class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Description</label>
              <textarea id="item-description" rows="2" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" required></textarea>
            </div>
            <div class="md:col-span-2 flex space-x-2 pt-2">
              <button type="submit" id="save-btn" class="px-5 py-2.5 bg-emerald-600 text-white rounded-lg font-medium text-sm hover:bg-emerald-700 transition">Add Product</button>
              <button type="button" id="cancel-btn" class="px-5 py-2.5 bg-slate-200 text-slate-700 rounded-lg font-medium text-sm hover:bg-slate-300 transition hidden">Cancel</button>
            </div>
          </form>
        </div>

        <!-- Inventory Table with Horizontal Scroll Wrapper -->
        <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
          <div class="overflow-x-auto min-w-full">
            <table class="w-full text-left text-sm text-slate-600 min-w-[640px]">
              <thead class="bg-slate-50 border-b border-slate-200 font-semibold text-slate-700">
                <tr>
                  <th class="p-3.5">Product</th>
                  <th class="p-3.5">Category</th>
                  <th class="p-3.5">Price</th>
                  <th class="p-3.5">Stock</th>
                  <th class="p-3.5">Status</th>
                  <th class="p-3.5 text-right whitespace-nowrap">Actions</th>
                </tr>
              </thead>
              <tbody id="inventory-table-body" class="divide-y divide-slate-200">
                <!-- Rows injected dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- 3. PROFILE SETTINGS VIEW -->
      <section id="view-profile" class="max-w-xl mx-auto bg-white p-4 md:p-6 rounded-xl border border-slate-200 shadow-sm hidden space-y-6">
        <h2 class="text-lg md:text-xl font-bold text-slate-900 border-b border-slate-200 pb-3">Edit Profile Settings</h2>
        <form id="profile-form" class="space-y-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Full Name</label>
            <input type="text" id="profile-name-input" value="Uzoechi Michael" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" required />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Email Address</label>
            <input type="email" id="profile-email-input" value="michael@marketmate.com" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" required />
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Store / Business Name</label>
            <input type="text" id="profile-store-input" value="MarketMate Electronics" class="w-full p-2.5 border border-slate-300 rounded-lg text-sm" />
          </div>
          <button type="submit" class="w-full py-2.5 bg-emerald-600 text-white rounded-lg font-medium text-sm hover:bg-emerald-700 transition">Save Profile Changes</button>
        </form>
      </section>

    </main>
  </div>

  <!-- SHOPPING CART SLIDE-OUT DRAWER -->
  <div id="cart-drawer-overlay" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden transition-opacity"></div>
  <aside id="cart-drawer" class="fixed top-0 right-0 h-full w-full max-w-md bg-white z-50 shadow-2xl flex flex-col justify-between transform translate-x-full transition-transform duration-300 ease-in-out">
    <div class="p-5 border-b border-slate-200 flex items-center justify-between">
      <h3 class="text-lg font-bold text-slate-900 flex items-center space-x-2">
        <i class="fa-solid fa-cart-shopping text-emerald-600"></i>
        <span>Shopping Cart</span>
      </h3>
      <button id="close-cart-btn" class="text-slate-400 hover:text-slate-700 text-lg px-2 py-1">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- CART ITEMS CONTAINER -->
    <div id="cart-items-list" class="flex-1 p-5 overflow-y-auto space-y-4">
      <!-- Injected dynamically -->
    </div>

    <!-- CART FOOTER & CHECKOUT -->
    <div class="p-5 border-t border-slate-200 bg-slate-50 space-y-4">
      <div class="flex items-center justify-between text-base font-bold text-slate-900">
        <span>Total Amount:</span>
        <span id="cart-total-price" class="text-emerald-700 text-xl">₦0</span>
      </div>
      <button id="checkout-btn" class="w-full py-3 bg-emerald-600 text-white font-bold rounded-lg hover:bg-emerald-700 transition active:scale-95">
        Proceed to Checkout
      </button>
    </div>
  </aside>

  <script type="module" src="./app.js"></script>
</body>
</html>
